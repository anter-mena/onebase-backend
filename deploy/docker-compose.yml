# Runs on the VPS in /opt/onebase. The pipeline copies this file there on every deploy
# and writes BACKEND_IMAGE into /opt/onebase/.env.
services:
  db:
    image: postgres:16-alpine
    container_name: onebase-db
    restart: unless-stopped
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD. Lives only on the VPS:
    # /opt/onebase/db.env, readable by the deploy user only.
    env_file: db.env
    # No "ports:" on purpose — only the backend, on Docker's internal network, can reach it.
    volumes:
      # The data. Survives every redeploy; only "docker compose down -v" would delete it.
      - onebase_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Lets the backend see the containers (System status → Containers) without ever
  # touching the Docker socket. That socket is root on the host: a web app holding
  # it turns one bug into the whole machine. This holds it instead, and answers
  # GET requests about containers only — CONTAINERS=1 is the one permission, and
  # every write (restart, exec, …) is refused. Same setup as the LMS.
  # No "ports:" on purpose: only containers on this compose network can reach it.
  docker-socket-proxy:
    # Pinned: this guards the Docker socket, so no unreviewed "latest".
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: onebase-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: onebase-backend
    restart: unless-stopped
    # Secrets (Swagger login, DB password, JWT secret…). Lives only on the VPS,
    # never in git: /opt/onebase/backend.env, readable by the deploy user only.
    env_file: backend.env
    environment:
      # Not a secret: an address that exists only inside this compose network.
      - DOCKER_API_URL=http://docker-socket-proxy:2375
    volumes:
      # System status → Server. Both read-only, both a single file:
      # - the machine's OS name (inside the container it would say the image's Linux);
      # - the machine's network byte counters. /proc/net is per-container, so this
      #   reads it through PID 1, which lives on the host. Only interface counters —
      #   not /proc, which would expose every process and its secrets.
      - /etc/os-release:/host/etc/os-release:ro
      - /proc/1/net/dev:/host/proc/1/net/dev:ro
      # SEO Overview: the Google Analytics service account key (GA4_CREDENTIALS_FILE in
      # backend.env). Only on the VPS, never in git: /opt/onebase/secrets/ga4-key.json,
      # owned by the container user (999), read-only for it alone.
      - /opt/onebase/secrets/ga4-key.json:/run/secrets/ga4-key.json:ro
    # Deliberately no depends_on the proxy: it is a panel on a monitoring page, and
    # a failed pull of it must not stop the app. Unreachable shows as "not connected".
    depends_on:
      db:
        condition: service_healthy
    ports:
      # BACKEND_BIND comes from site.env. Unset = public (the old VPS, until the move).
      # 127.0.0.1 = only this machine: deploy.sh's health check; the world goes through Caddy.
      # Docker ignores ufw for published ports, so this is what actually closes 8080.
      - "${BACKEND_BIND:-0.0.0.0}:8080:8080"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS in front of the backend. Gets and renews the Let's Encrypt certificate for
  # API_DOMAIN by itself. Only runs where site.env turns on the "https" profile.
  caddy:
    image: caddy:2.10-alpine
    container_name: onebase-caddy
    profiles: ["https"]
    restart: unless-stopped
    environment:
      - API_DOMAIN=${API_DOMAIN:-}
      # n8n.onebase.live where site.env turns n8n on; a local name nobody reaches elsewhere.
      - N8N_DOMAIN=${N8N_DOMAIN:-n8n.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates. Kept across redeploys so Let's Encrypt is not asked again.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # n8n, for automations (2026-10-28): first the weekly report email, each Sunday 00:00
  # (Toronto). Behind Caddy at N8N_DOMAIN, with no port of its own. Its workflows, logins
  # and runs live in their own database ("n8n", with its own user) in the same Postgres,
  # so it cannot read OneBase's tables; the n8n database has its own daily dump below.
  # Only runs where site.env turns on the "automation" profile.
  n8n:
    # Pinned to the version n8n itself marks "stable" (2026-10-28): never an unreviewed "latest".
    image: n8nio/n8n:2.45.5
    container_name: onebase-n8n
    profiles: ["automation"]
    restart: unless-stopped
    # DB_POSTGRESDB_PASSWORD and N8N_ENCRYPTION_KEY. Lives only on the VPS, never in
    # git: /opt/onebase/n8n.env, readable by the deploy user only. Without the
    # encryption key the logins saved in n8n cannot be read: keep a copy (ACCESS.md).
    env_file: n8n.env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - N8N_HOST=${N8N_DOMAIN:-n8n.localhost}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_WEBHOOK_URL=https://${N8N_DOMAIN:-n8n.localhost}/
      # No community add-ons from outside n8n's own review.
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      # Caddy is the one proxy in front of it.
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=America/Toronto
      - TZ=America/Toronto
      # Nothing about this instance is sent to n8n.
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Runs are kept two weeks, then pruned, so its database does not grow forever.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One database dump a day into /opt/onebase/backups, the last 14 kept.
  # Restore: pg_restore -h db -U <user> -d <db> --clean <file>.dump
  # Only runs where site.env turns on the "backup" profile.
  backup:
    image: postgres:16-alpine
    container_name: onebase-backup
    profiles: ["backup"]
    restart: unless-stopped
    env_file: db.env
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        while true; do
          file="/backups/onebase-$$(date +%F).dump"
          if pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file" && echo "Backup written: $$file"
          else
            rm -f "$$file.tmp"; echo "Backup FAILED"
          fi
          find /backups -name 'onebase-*.dump' -mtime +14 -delete
          # n8n's own database (its workflows and saved logins), where it exists.
          if psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "select 1 from pg_database where datname = 'n8n'" | grep -q 1; then
            file="/backups/n8n-$$(date +%F).dump"
            if pg_dump -h db -U "$$POSTGRES_USER" -d n8n -Fc -f "$$file.tmp"; then
              mv "$$file.tmp" "$$file" && echo "Backup written: $$file"
            else
              rm -f "$$file.tmp"; echo "n8n backup FAILED"
            fi
            find /backups -name 'n8n-*.dump' -mtime +14 -delete
          fi
          sleep 86400
        done
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  onebase_db:
  caddy_data:
  caddy_config:
  n8n_data:
