spring.application.name=onebase-backend

# Local secrets live in a git-ignored .env file next to pom.xml (see .env.example).
# On the VPS they come from /opt/onebase/backend.env instead.
spring.config.import=optional:file:.env[.properties]

# ── Database (PostgreSQL 16) ─────────────────────────────────────────────
# The schema belongs to Flyway (src/main/resources/db/migration); Hibernate only
# checks that the entities match it and never changes a table itself.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onebase}
spring.datasource.username=${DB_USERNAME:onebase}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Sign-in ──────────────────────────────────────────────────────────────
# At least 32 random characters. No default on purpose: without it the app will not start.
onebase.jwt.secret=${JWT_SECRET}
onebase.jwt.ttl=${JWT_TTL:PT12H}

# First account, created only while the users table is empty (see BootstrapOwner).
onebase.bootstrap.owner-name=${BOOTSTRAP_OWNER_NAME:Owner}
onebase.bootstrap.owner-email=${BOOTSTRAP_OWNER_EMAIL:}
onebase.bootstrap.owner-password=${BOOTSTRAP_OWNER_PASSWORD:}

# Where password-reset links point.
onebase.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Emails are only sent once SPRING_MAIL_HOST (+ _PORT, _USERNAME, _PASSWORD) is set.
onebase.mail.from=${MAIL_FROM:One Base <no-reply@onebase.local>}

# ── Swagger / docs login ─────────────────────────────────────────────────
# No defaults on purpose: the app will not start without them.
onebase.docs.username=${SWAGGER_USERNAME}
onebase.docs.password=${SWAGGER_PASSWORD}
springdoc.swagger-ui.path=/swagger-ui.html

# System status (/api/system/health)
# p95 / p99 response times for the Backend tab. Spring records the timers anyway; this keeps the percentiles too.
management.metrics.distribution.percentiles.http.server.requests=0.95,0.99
# The read-only Docker proxy (deploy/docker-compose.yml). Empty locally: the Containers tab then says "not connected".
onebase.docker.api-url=${DOCKER_API_URL:}
