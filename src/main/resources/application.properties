spring.application.name=onebase-backend

# Local secrets live in a git-ignored .env file next to pom.xml (see .env.example).
# On the VPS they come from /opt/onebase/backend.env instead.
spring.config.import=optional:file:.env[.properties]

# Swagger / docs login. No defaults on purpose: the app will not start without them.
onebase.docs.username=${SWAGGER_USERNAME}
onebase.docs.password=${SWAGGER_PASSWORD}

springdoc.swagger-ui.path=/swagger-ui.html
